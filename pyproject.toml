[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "news-youtube-bot"
version = "0.2.0"
description = "Daily technology YouTube Shorts from fresh news, with review before upload"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "google-genai>=1.0.0",
    "openai>=1.40",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.29",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
news-youtube-bot = "news_youtube_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
