name: Upload approved Shorts

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Comma-separated review ids to approve, then upload up to the daily cap"
        required: false
        default: ""

# Shares a group with the daily render so the two cannot run at once.
concurrency:
  group: youtube-ai-shorts
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        run: pip install -e .

      - name: Restore story history and review queue
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            output/review
          key: shorts-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shorts-state-

      - name: Approve requested ids and upload
        env:
          APPROVE_IDS: ${{ github.event.inputs.approve }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}
          YOUTUBE_TAGS: ${{ vars.YOUTUBE_TAGS }}
          MAX_UPLOADS_PER_DAY: ${{ vars.MAX_UPLOADS_PER_DAY }}
          UPLOAD_QUOTA_COST: ${{ vars.UPLOAD_QUOTA_COST }}
          YOUTUBE_DAILY_QUOTA_UNITS: ${{ vars.YOUTUBE_DAILY_QUOTA_UNITS }}
          DRY_RUN: "0"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - << 'PY'
          import os
          import sys
          from news_youtube_bot.config import Settings
          from news_youtube_bot.review_queue import ReviewQueue

          raw = os.environ.get("APPROVE_IDS", "")
          ids = [item.strip() for item in raw.split(",") if item.strip()]
          if not ids:
              print("No ids passed. Uploading whatever is already approved.")
              sys.exit(0)
          settings = Settings.load()
          queue = ReviewQueue(settings.output_dir / "review")
          for item_id in ids:
              queue.transition(item_id, "approved", queue_reason="")
              print(f"approved {item_id}")
          queue.write_index()
          PY
          python -m news_youtube_bot upload

      - name: Ensure state directories exist
        if: always()
        run: mkdir -p data output/review && touch data/.keep output/review/.keep

      - name: Persist saved state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output/review
          key: shorts-state-${{ github.run_id }}-${{ github.run_attempt }}
